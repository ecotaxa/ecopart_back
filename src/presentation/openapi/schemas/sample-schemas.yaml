components:
  schemas:
    PublicSample:
      type: object
      description: Public sample information returned by API endpoints.
      properties:
        sample_id:
          type: integer
          description: Unique sample identifier.
          example: 1
        sample_creation_utc_date_time:
          type: string
          description: Sample creation date (UTC, ISO format).
          example: "2024-01-15T10:30:00.000Z"
        sample_name:
          type: string
          description: Sample name.
          example: "Mooring_BATS_20240615"
        comment:
          type: string
          description: Optional comment.
        instrument_serial_number:
          type: string
          description: Instrument serial number.
          example: "000002LP"
        max_pressure:
          type: number
          description: Maximum pressure recorded.
        station_id:
          type: string
          description: Station identifier.
        sampling_utc_date_time:
          type: string
          description: Start time of the sample (UTC, ISO format).
          example: "2024-06-15T08:00:00.000Z"
        latitude:
          type: number
          description: "Latitude in decimal degrees (negative for South)."
          example: 43.2965
        longitude:
          type: number
          description: "Longitude in decimal degrees (negative for West)."
          example: 5.3698
        wind_direction:
          type: number
          description: Wind direction in degrees.
        wind_speed:
          type: number
          description: Wind speed.
        sea_state:
          type: string
          description: Description or classification of sea state.
        nebulousness:
          type: number
          description: Cloud coverage percentage (0-100).
          minimum: 0
          maximum: 100
        bottom_depth:
          type: number
          description: Bottom depth in meters.
        instrument_operator_email:
          type: string
          format: email
          description: Instrument operator email.
        filename:
          type: string
          description: Source file name.
        filter_first_image:
          type: string
          description: First image filter.
        filter_last_image:
          type: string
          description: Last image filter.
        instrument_settings_acq_gain:
          type: number
          description: Acquisition gain.
        instrument_settings_acq_description:
          type: string
          description: Acquisition description.
        instrument_settings_acq_task_type:
          type: number
          description: Acquisition task type.
        instrument_settings_acq_choice:
          type: number
          description: Acquisition choice.
        instrument_settings_acq_disk_type:
          type: number
          description: Acquisition disk type.
        instrument_settings_acq_vignette_roi_enlargement_ratio:
          type: number
          description: Enlargement ratio for the saving of the vignette (a wider area than the ROI is cropped around each detected object).
        instrument_settings_acq_x_size:
          type: number
          description: X dimension of the imager, in pixels.
        instrument_settings_acq_y_size:
          type: number
          description: Y dimension of the imager, in pixels.
        instrument_settings_acq_erase_border:
          type: number
          description: "Acquisition erase border flag (0 or 1)."
        instrument_settings_acq_threshold:
          type: number
          description: Acquisition threshold value.
        instrument_settings_acq_pressure_gain:
          type: number
          description: |
            Factor converting the raw pressure of the LPM data files to decibar (`raw × pressure_gain = decibar`):
            `0.1` for UVP5, `1` for UVP6. Omitted when not set.
        instrument_settings_process_datetime:
          type: string
          description: Process date and time in ISO format.
        instrument_settings_process_gamma:
          type: number
          description: Process gamma value.
        instrument_settings_process_vignette_resize_factor:
          type: number
          description: |
            Scale factor used to resize vignettes when saving them (`1` = unchanged): UVP5SD = 2, UVP5HD = 1,
            UVP6 = `scale` from `compute_vignettes.txt`. Omitted when not set.
        instrument_settings_images_post_process:
          type: string
          description: Image post-processing details.
        instrument_settings_aa:
          type: number
          description: "Aa value for UVP6 (divided by 10^6)."
        instrument_settings_exp:
          type: number
          description: Exp value.
        instrument_settings_image_volume_l:
          type: number
          description: Image volume in liters.
        instrument_settings_pixel_size_mm:
          type: number
          description: Pixel size in millimeters.
        instrument_settings_depth_offset_m:
          type: number
          description: Depth offset in meters.
        instrument_settings_particule_minimum_area_pixels:
          type: number
          description: Minimum object area for counting and sizing in the processed image, in pixel².
        instrument_settings_vignette_minimum_area_pixels:
          type: number
          description: Minimum object area for saving its vignette, in pixel².
        instrument_settings_acq_shutter_speed:
          type: number
          description: "Shutter code for UVP5SD (`12` = 100 µs = 1/10000 s)."
        instrument_settings_acq_exposure:
          type: number
          description: Shutter value in µs (UVP5HD, UVP6).
        instrument_settings_integration_time:
          type: number
          description: Integration time in seconds (UVP5 Time samples, from the meta file). Omitted when not set.
        nb_vignettes:
          type: integer
          description: Number of vignettes at import time.
        nb_black:
          type: integer
          description: Number of black (lights-off) images at import time, used as noise reference.
        visual_qc_validator_user_id:
          type: integer
          description: Quality check validator user ID.
        visual_qc_status_id:
          type: integer
          description: Quality check status ID.
        visual_qc_status_label:
          type: string
          description: "Quality check status label (e.g., PENDING, VALIDATED, REJECTED)."
          example: "PENDING"
        visual_qc_validator_user:
          type: string
          description: "Quality check validator user name (format: first_name last_name (email)). `()` when there is no validator."
        visual_qc_validator_email:
          type: string
          description: Quality check validator email. Empty string when there is no validator.
        visual_qc_comment:
          type: string
          nullable: true
          description: Quality check reviewer comment. Null until the sample is reviewed.
        visual_qc_validation_utc_date_time:
          type: string
          nullable: true
          description: Date the sample was validated or rejected (UTC, ISO format). Null until the sample is reviewed.
        sample_type_id:
          type: integer
          description: Sample type ID.
        sample_type_label:
          type: string
          description: "Sample type label (e.g., Time, Depth)."
          example: "Time"
        project_id:
          type: integer
          description: Parent project ID.
        ecotaxa_import_status_id:
          type: integer
          description: EcoTaxa import status ID.
        ecotaxa_import_status_label:
          type: string
          description: EcoTaxa import status label.
        ecotaxa_sample_imported:
          type: boolean
          description: Whether the sample has been imported to EcoTaxa.
        ecotaxa_sample_import_utc_date_time:
          type: string
          nullable: true
          description: EcoTaxa import date (UTC, ISO format).
        ecotaxa_sample_id:
          type: integer
          nullable: true
          description: EcoTaxa sample ID.
        ecotaxa_sample_tsv_file_name:
          type: string
          nullable: true
          description: EcoTaxa TSV file name.
        ecotaxa_sample_local_folder_tsv_path:
          type: string
          nullable: true
          description: Server-side path of the TSV file sent to EcoTaxa.
        ecotaxa_sample_nb_images:
          type: integer
          nullable: true
          description: Number of EcoTaxa images.
        ecotaxa_sample_task_id:
          type: integer
          nullable: true
          description: ID of the task that imported the sample into EcoTaxa (see `GET /projects/{project_id}/tasks/{task_id}`).
        ctd_imported:
          type: boolean
          description: Whether a CTD file is imported for the sample. All other `ctd_*` fields are null when false.
        ctd_station_id:
          type: string
          nullable: true
          description: Sample station ID at CTD import time.
        ctd_file_extension:
          type: string
          nullable: true
          description: Extension of the imported CTD file.
          example: "ctd"
        ctd_import_utc_date_time:
          type: string
          nullable: true
          description: CTD import date (UTC, ISO format).
          example: "2024-01-15T10:30:00.000Z"
        ctd_original_file_name:
          type: string
          nullable: true
          description: CTD file name in the project CTD folder.
        ctd_imported_file_name:
          type: string
          nullable: true
          description: CTD file name in the sample storage folder.
        ctd_importator_user_id:
          type: integer
          nullable: true
          description: ID of the user who imported the CTD file.
        ctd_importator_name:
          type: string
          nullable: true
          description: Name (first + last) of the user who imported the CTD file.
        ctd_importator_email:
          type: string
          nullable: true
          description: Email of the user who imported the CTD file.
        ctd_import_task_id:
          type: integer
          nullable: true
          description: |
            ID of the IMPORT_CTD task that imported the CTD file (see `GET /projects/{project_id}/tasks/{task_id}`).
            Null when that task was deleted, or when the CTD file was imported before this field existed.
        ctd_description:
          type: string
          nullable: true
          description: |
            Custom (non-standard) columns of the imported CTD file, numbered in file order, one `NN=<column title>` per line
            (legacy EcoPart `ctd_desc`). Standard columns and their accepted alternative spellings are not listed; the list
            of standard columns is in `GET /projects/{project_id}/ctd_samples/can_be_imported`. Computed per sample from its own
            CTD file header, so it can differ between samples of a project. Null when the file has no custom column, or when
            the CTD file was imported before this field existed.
          example: "01=pH\n02=Turbidity [NTU]"
        ctd_latitude:
          type: number
          nullable: true
          description: |
            Start latitude read from the imported CTD file (decimal degrees, negative for South): the `LAT` column
            (case-insensitive; `latitude` also accepted) of the first data row whose latitude and longitude are both valid.
            Null when no CTD file is imported, or when the file has no position columns or no valid row (e.g. UVP5 files).
          example: 63.3475635770627
        ctd_longitude:
          type: number
          nullable: true
          description: |
            Start longitude read from the imported CTD file (decimal degrees, negative for West): the `LON` column
            (case-insensitive; `long` and `longitude` also accepted), same row as `ctd_latitude`.
          example: -20.2736111743117
        use_ctd_coordinates:
          type: boolean
          description: |
            Which position is selected for the sample. false (default) = the particle-file coordinates
            (`latitude`/`longitude`); true = the CTD-file ones (`ctd_latitude`/`ctd_longitude`). Set with
            `PATCH /projects/{project_id}/samples/{sample_id}/coordinates`; reset to false when the CTD is deleted.
          example: false

    SampleSearchResponse:
      type: object
      description: Paginated sample search results.
      properties:
        search_info:
          $ref: "#/components/schemas/SearchInfo"
        samples:
          type: array
          items:
            $ref: "#/components/schemas/PublicSample"
