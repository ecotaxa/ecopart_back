components:
  schemas:
    ProjectRequestCreation:
      type: object
      description: Request body for creating a new project.
      properties:
        root_folder_path:
          type: string
          description: Import folder path relative to the import root (as returned by
            /file_system/import_folders).
          example: "remote/ftp_plankton/Ecotaxa_Data_to_import/uvp6_sn000241lp_20240404_h\
            ope02"
        project_title:
          type: string
          description: Full title of the project.
          example: "Mediterranean Particle Survey 2024"
        project_acronym:
          type: string
          description: Short acronym for the project.
          example: "MPS2024"
        project_description:
          type: string
          description: Description of the project.
          example: "Survey of marine particles in the Mediterranean Sea."
        project_information:
          type: string
          description: Additional project information (optional).
        cruise:
          type: string
          description: Name of the research cruise.
          example: "MOOSE-GE 2024"
        ship:
          type: string
          description: Name of the research vessel.
          example: "Thalassa"
        data_owner_name:
          type: string
          description: Name of the data owner.
          example: "John Smith"
        data_owner_email:
          type: string
          format: email
          description: Email of the data owner.
          example: "john.smith@example.com"
        operator_name:
          type: string
          description: Name of the instrument operator.
          example: "Jane Doe"
        operator_email:
          type: string
          format: email
          description: Email of the instrument operator.
          example: "jane.doe@example.com"
        chief_scientist_name:
          type: string
          description: Name of the chief scientist.
          example: "Prof. Martin"
        chief_scientist_email:
          type: string
          format: email
          description: Email of the chief scientist.
          example: "prof.martin@example.com"
        override_depth_offset:
          type: number
          description: Optional depth offset override in meters.
        enable_descent_filter:
          type: boolean
          description: Whether to enable the descent filter.
          example: true
        filtered_project:
          type: boolean
          default: false
          description: The data were filtered before their import (expected of a UVP5HD project).
        time_duration_check:
          type: boolean
          default: true
          description: Warn when the samples span more than a year; disable it on a long project.
        privacy_duration:
          type: number
          description: Duration in months for which the project data is private.
          example: 24
        visible_duration:
          type: number
          description: Duration in months for which the project data is visible (metadata
            only).
          example: 36
        public_duration:
          type: number
          description: Duration in months for which the project data is fully public.
          example: 48
        instrument_model:
          type: string
          description: Name or ID of the instrument model.
          example: "UVP5HD"
        serial_number:
          type: string
          description: Serial number of the instrument.
          example: "SN001"
        members:
          type: array
          description: List of project members (users with view access).
          items:
            $ref: "#/components/schemas/MinimalUser"
        managers:
          type: array
          description: List of project managers (users with full access).
          items:
            $ref: "#/components/schemas/MinimalUser"
        contact:
          $ref: "#/components/schemas/MinimalUser"
        ecotaxa_project_id:
          type: integer
          nullable: true
          description: Linked EcoTaxa project ID (null if none).
        ecotaxa_project_name:
          type: string
          nullable: true
          description: Linked EcoTaxa project name.
        ecotaxa_instance_id:
          type: integer
          nullable: true
          description: EcoTaxa instance ID for the linked project.
        new_ecotaxa_project:
          type: boolean
          description: Whether to create a new EcoTaxa project.
        ecotaxa_account_id:
          type: integer
          nullable: true
          description: EcoTaxa account ID to use for project creation.
      required:
        - root_folder_path
        - project_title
        - project_acronym
        - cruise
        - data_owner_name
        - data_owner_email
        - operator_name
        - operator_email
        - chief_scientist_name
        - chief_scientist_email
        - enable_descent_filter
        - privacy_duration
        - visible_duration
        - public_duration
        - instrument_model
        - serial_number
        - members
        - managers
        - contact

    ProjectUpdate:
      type: object
      description: Request body for updating a project. All fields are optional.
      properties:
        root_folder_path:
          type: string
          description: Import folder path relative to the import root (as returned by
            /file_system/import_folders).
        project_title:
          type: string
          description: Full title of the project.
        project_acronym:
          type: string
          description: Short acronym for the project.
        project_description:
          type: string
          description: Description of the project.
        project_information:
          type: string
          description: Additional project information.
        cruise:
          type: string
          description: Name of the research cruise.
        ship:
          type: string
          description: Name of the research vessel.
        data_owner_name:
          type: string
          description: Name of the data owner.
        data_owner_email:
          type: string
          format: email
          description: Email of the data owner.
        operator_name:
          type: string
          description: Name of the instrument operator.
        operator_email:
          type: string
          format: email
          description: Email of the instrument operator.
        chief_scientist_name:
          type: string
          description: Name of the chief scientist.
        chief_scientist_email:
          type: string
          format: email
          description: Email of the chief scientist.
        override_depth_offset:
          type: number
          description: Optional depth offset override in meters.
        enable_descent_filter:
          type: boolean
          description: Whether to enable the descent filter.
        filtered_project:
          type: boolean
          description: The data were filtered before their import (expected of a UVP5HD project).
        time_duration_check:
          type: boolean
          description: Warn when the samples span more than a year; disable it on a long project.
        privacy_duration:
          type: number
          description: Duration in months for private data access.
        visible_duration:
          type: number
          description: Duration in months for visible data access.
        public_duration:
          type: number
          description: Duration in months for public data access.
        instrument_model:
          type: string
          description: Instrument model name or ID.
        serial_number:
          type: string
          description: Instrument serial number.
        members:
          type: array
          description: List of project members.
          items:
            $ref: "#/components/schemas/MinimalUser"
        managers:
          type: array
          description: List of project managers.
          items:
            $ref: "#/components/schemas/MinimalUser"
        contact:
          $ref: "#/components/schemas/MinimalUser"
        ecotaxa_project_id:
          type: integer
          nullable: true
          description: Linked EcoTaxa project ID. Set to null to unlink the project from
            EcoTaxa.
        ecotaxa_instance_id:
          type: integer
          nullable: true
          description: EcoTaxa instance ID. Required when linking an existing EcoTaxa
            project or creating a new one.
        new_ecotaxa_project:
          type: boolean
          description: Set to true to create a new EcoTaxa project and link it to this
            EcoPart project.
        ecotaxa_account_id:
          type: integer
          nullable: true
          description: EcoTaxa account ID to use for link/create operations. Not required
            for unlink.

    PublicProjectResponse:
      type: object
      description: |
        Public project information returned by API endpoints. Every logged-in user may read a
        project's metadata, whatever its privacy status, so that access can be requested from its
        managers; `root_folder_path` and `last_backup_utc_date_time` are only present for admins and
        for the project's members and managers.
      properties:
        project_id:
          type: integer
          description: Unique project identifier.
          example: 1
        project_creation_date:
          type: string
          description: Project creation date.
          example: "2024-01-15T10:30:00.000Z"
        oldest_sample_utc_date_time:
          type: string
          nullable: true
          description: |
            Acquisition date of the project's oldest sample (smallest `sampling_utc_date_time`), computed
            from the samples. The privacy delays run from it. Null while the project has no sample.
          example: "2019-10-12T15:15:16Z"
        privacy_status:
          type: string
          enum: [private, visible, public, open]
          description: |
            Current privacy status, computed from `oldest_sample_utc_date_time` and the three durations
            below (months). A project without any sample is `private`.
            For a user without privilege on the project: `private` = metadata only, `visible` = samples
            and QC graphs too, `public` = binned export too, `open` = EcoTaxa classification data too.
            Members and managers are not bound by it.
          example: visible
        root_folder_path:
          type: string
          description: Import folder path relative to the import root. Members, managers and admins only.
        project_title:
          type: string
          description: Full title of the project.
        project_acronym:
          type: string
          description: Short acronym for the project.
        project_description:
          type: string
          description: Description of the project.
        project_information:
          type: string
          description: Additional project information.
        cruise:
          type: string
          description: Name of the research cruise.
        ship:
          type: string
          description: Name of the research vessel.
        data_owner_name:
          type: string
          description: Name of the data owner.
        data_owner_email:
          type: string
          format: email
          description: Email of the data owner.
        operator_name:
          type: string
          description: Name of the instrument operator.
        operator_email:
          type: string
          format: email
          description: Email of the instrument operator.
        chief_scientist_name:
          type: string
          description: Name of the chief scientist.
        chief_scientist_email:
          type: string
          format: email
          description: Email of the chief scientist.
        override_depth_offset:
          type: number
          description: Depth offset override in meters.
        enable_descent_filter:
          type: boolean
          description: Whether the descent filter is enabled.
        filtered_project:
          type: boolean
          description: The data were filtered before their import (expected of a UVP5HD project).
        time_duration_check:
          type: boolean
          description: Whether the project warns when its samples span more than a year.
        privacy_duration:
          type: number
          description: Duration in months for private access.
        visible_duration:
          type: number
          description: Duration in months for visible access.
        public_duration:
          type: number
          description: Duration in months for public access.
        instrument_model:
          type: string
          description: Instrument model name.
        serial_number:
          type: string
          description: Instrument serial number.
        members:
          type: array
          items:
            $ref: "#/components/schemas/MinimalUser"
        managers:
          type: array
          items:
            $ref: "#/components/schemas/MinimalUser"
        contact:
          $ref: "#/components/schemas/MinimalUser"
        ecotaxa_project_id:
          type: integer
          nullable: true
          description: Linked EcoTaxa project ID.
        ecotaxa_project_name:
          type: string
          nullable: true
          description: Linked EcoTaxa project name.
        ecotaxa_instance_id:
          type: integer
          nullable: true
          description: EcoTaxa instance ID.

    ProjectStatsCounts:
      type: object
      properties:
        stations: { type: integer, description: Distinct station ids of the samples. }
        samples: { type: integer }
        particles: { type: integer, description: Sum of the samples' particle counts (unknown counts as 0). }
        vignettes: { type: integer, description: Sum of the samples' vignette counts. }
        exports: { type: integer, description: Export tasks of the project (EXPORT, EXPORT_BACKUP, EXPORT_RAW), whatever their status. }
      required: [stations, samples, particles, vignettes, exports]
    ProjectStatsPrivacy:
      type: object
      description: The privacy timeline, counted in months from the acquisition date of the oldest sample; the dates are null while the project has no sample.
      properties:
        status: { type: string, enum: [private, visible, public, open] }
        oldest_sample_utc_date_time: { type: string, format: date-time, nullable: true }
        visible_utc_date_time: { type: string, format: date-time, nullable: true, description: When the project becomes visible. }
        public_utc_date_time: { type: string, format: date-time, nullable: true, description: When the project becomes public. }
        open_utc_date_time: { type: string, format: date-time, nullable: true, description: When the project becomes open. }
      required: [status, oldest_sample_utc_date_time, visible_utc_date_time, public_utc_date_time, open_utc_date_time]
    ProjectStatsRawBackup:
      type: object
      properties:
        last_backup_utc_date_time: { type: string, format: date-time, nullable: true }
        nb_samples_not_backed_up: { type: integer, description: Samples imported after the last backup (every sample when there was none). }
      required: [last_backup_utc_date_time, nb_samples_not_backed_up]
    ProjectStatsMapSample:
      type: object
      properties:
        sample_id: { type: integer }
        sample_name: { type: string }
        latitude: { type: number, nullable: true, description: Position of the sample metadata. }
        longitude: { type: number, nullable: true }
        ctd_latitude: { type: number, nullable: true, description: Position read from the CTD file, when it has one. }
        ctd_longitude: { type: number, nullable: true }
        use_ctd_coordinates: { type: boolean, description: Which of the two positions the project uses as the sample position. }
        coordinates_mismatch: { type: boolean, description: Both positions are known and more than 5 km apart. }
        on_land: { type: boolean, description: "The position used is on land (Natural Earth 1:10m land minus its lakes), more than 2 km from the sea or a lake." }
      required: [sample_id, sample_name, latitude, longitude, ctd_latitude, ctd_longitude, use_ctd_coordinates, coordinates_mismatch, on_land]
    ProjectStatsMap:
      type: object
      properties:
        samples: { type: array, items: { $ref: "#/components/schemas/ProjectStatsMapSample" } }
        nb_samples_without_ctd: { type: integer }
        nb_coordinates_mismatches: { type: integer }
        nb_samples_on_land: { type: integer, description: Samples whose position used is on land. }
      required: [samples, nb_samples_without_ctd, nb_coordinates_mismatches, nb_samples_on_land]
    ProjectStatsSamples:
      type: object
      properties:
        sample_types:
          type: object
          properties:
            depth: { type: integer }
            time: { type: integer }
            total: { type: integer }
        pressure_range:
          type: object
          nullable: true
          properties: { min: { type: number }, max: { type: number } }
          description: dbar
        size_range:
          type: object
          nullable: true
          properties: { min: { type: number }, max: { type: number } }
          description: ESD in µm of the smallest and largest particles counted.
        time_range:
          type: object
          nullable: true
          properties: { start: { type: string, format: date-time }, end: { type: string, format: date-time } }
        max_pressure_histogram:
          type: array
          items:
            type: object
            properties: { max_pressure: { type: number, description: Upper edge of the 100 dbar bin. }, nb_profiles: { type: integer } }
        nb_instrument_parameter_mismatches: { type: integer, description: Samples whose instrument parameters differ from the most common ones of the project. }
        nb_object_size_mismatches: { type: integer, description: Samples with objects outside the size classes of the instrument model. }
        nb_suspicious_dates: { type: integer, description: Samples dated before 2008, in the future, or with an unreadable date. }
        time_span_over_a_year: { type: boolean, description: The samples span more than a year, while the project keeps the time duration check. }
        nb_suspicious_pressures: { type: integer, description: Samples with a minimum pressure below -5 dbar or a maximum above 6500 dbar, and depth samples without a positive maximum pressure. }
        unfiltered_uvp5hd: { type: boolean, description: A UVP5HD project whose data were not declared filtered before import. }
      required: [sample_types, pressure_range, size_range, time_range, max_pressure_histogram, nb_instrument_parameter_mismatches, nb_suspicious_dates, nb_suspicious_pressures]
    ProjectStatsEcoTaxa:
      type: object
      properties:
        linked: { type: boolean, description: The project is linked to an EcoTaxa project; every other field is empty otherwise. }
        categories: { type: array, items: { type: string }, description: Display names of the taxa used, sorted. }
        classification:
          type: object
          description: Percentages of the samples with EcoTaxa stats, exclusive states.
          properties:
            fully_validated: { type: number }
            fully_predicted: { type: number }
            partially_validated: { type: number }
            partially_predicted: { type: number }
        objects:
          type: object
          description: The objects of the samples with EcoTaxa stats, by classification state.
          properties:
            total: { type: integer }
            validated: { type: integer }
            predicted: { type: integer }
        nb_samples_with_stats: { type: integer }
        partial: { type: boolean, description: "Some samples have no stats yet: they are being read from EcoTaxa in the background, ask again later." }
        nb_samples_pending: { type: integer }
        nb_samples_not_imported: { type: integer, description: Samples of the project not imported in EcoTaxa. }
        classification_completed: { type: boolean, description: Every sample imported in EcoTaxa has its stats and every object of theirs is validated. }
      required: [linked, categories, classification, objects, nb_samples_with_stats, partial, nb_samples_pending, nb_samples_not_imported, classification_completed]
    ProjectStats:
      type: object
      description: The statistics of a project, as its STATS tab shows them.
      properties:
        project_id: { type: integer }
        generated_at: { type: string, format: date-time }
        counts: { $ref: "#/components/schemas/ProjectStatsCounts" }
        privacy: { $ref: "#/components/schemas/ProjectStatsPrivacy" }
        raw_backup:
          allOf: [{ $ref: "#/components/schemas/ProjectStatsRawBackup" }]
          nullable: true
          description: Null for a user without privilege on the project.
        map: { $ref: "#/components/schemas/ProjectStatsMap" }
        samples: { $ref: "#/components/schemas/ProjectStatsSamples" }
        ecotaxa: { $ref: "#/components/schemas/ProjectStatsEcoTaxa" }
      required: [project_id, generated_at, counts, privacy, raw_backup, map, samples, ecotaxa]

    ProjectQcStatesRequest:
      type: object
      properties:
        project_ids:
          type: array
          description: The projects to read, at most 100 (a page of the project lists).
          maxItems: 100
          items: { type: integer, minimum: 1 }
          example: [12, 15, 902]
      required: [project_ids]

    ProjectQcWarning:
      type: object
      properties:
        code:
          type: string
          enum: [samples_not_backed_up, samples_without_ctd, coordinates_mismatches, samples_on_land, instrument_parameter_mismatches, object_size_mismatches, suspicious_dates, time_span_over_a_year, suspicious_pressures, unfiltered_uvp5hd, ecotaxa_not_linked, samples_not_imported_in_ecotaxa, classification_uncompleted]
          description: >-
            The warning of the STATS tab: samples imported since the last raw backup, samples without CTD
            file, samples whose CTD position is more than 5 km from their own, samples whose position is on land
            (more than 2 km from the sea or a lake), samples with other instrument
            parameters than the rest of the project, samples with objects outside the size classes of the
            instrument, suspicious sampling dates (before 2008, in the future, unreadable), samples spanning
            more than a year, suspicious pressures (below -5 dbar, above 6500 dbar, depth samples without
            one), a UVP5HD project not declared filtered, a project not linked to EcoTaxa, samples not imported
            in EcoTaxa, objects of the samples imported in EcoTaxa not all validated or predicted.
        nb_samples:
          type: integer
          nullable: true
          description: How many samples the warning concerns; null for `classification_uncompleted`.
      required: [code, nb_samples]

    ProjectQcState:
      type: object
      properties:
        project_id: { type: integer }
        qc_state:
          type: string
          enum: [empty, ok, warning]
          description: "`empty` without any sample, `ok` without any warning, `warning` otherwise."
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ProjectQcWarning" }
      required: [project_id, qc_state, warnings]

    ProjectSearchResponse:
      type: object
      description: Paginated project search results.
      properties:
        search_info:
          $ref: "#/components/schemas/SearchInfo"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/PublicProjectResponse"

    ProjectBackupRequest:
      type: object
      description: Request body for project backup operations.
      properties:
        skip_already_imported:
          type: boolean
          description: >-
            Incremental backup toggle. When `true`, a `raw/` sample folder is skipped if its `.zip`
            already exists in the backup (`meta/` and `config/` are always refreshed); when `false`,
            every `raw/` sample folder is re-zipped and existing archives are overwritten.
          example: true

    ProjectBackupExportRequest:
      type: object
      description: Request body for exporting a project backup.
      properties:
        ftp_export:
          type: boolean
          description: >-
            FTP export toggle. The export archive is always written to the task folder and downloadable
            via `GET /tasks/{task_id}/file`. When `true`, the same archive is additionally written to
            the FTP export folder (`<DATA_STORAGE_EXPORT>/<task_id>/`) and the task result also gives the
            archive path inside that folder (`<task_id>/<archive name>`).
          example: false

    SampleImportRequest:
      type: object
      description: Request body for importing samples into a project.
      properties:
        samples:
          type: array
          description: List of sample names/identifiers to import.
          items:
            type: string
        validated_samples:
          type: array
          description: >-
            Optional subset of `samples` to mark visual-QC VALIDATED immediately after import
            (verified via the pre-import QC preview). Must be a subset of `samples`. Samples not
            listed here stay PENDING.
          items:
            type: string
        backup_project:
          type: boolean
          description: >-
            When `true`, a project backup task is started after a successful import (skipped if the
            import fails). See `POST /projects/{project_id}/backup` for what the backup copies.
          example: false
        backup_project_skip_already_imported:
          type: boolean
          description: >-
            Forwarded to the backup task as `skip_already_imported` (only used when `backup_project`
            is `true`): `true` = incremental (skip `raw/` folders already backed up), `false` = full
            re-zip.
          example: true

    SampleImportResponse:
      type: object
      description: Response from sample import operation.
      properties:
        success:
          type: boolean
          description: Whether the overall operation was successful.
        task_import_samples:
          $ref: "#/components/schemas/TaskResponse"
        task_backup_project:
          $ref: "#/components/schemas/TaskResponse"
        errors:
          type: object
          description: Error details if any operation failed.
          properties:
            import:
              type: array
              items:
                type: string
            backup:
              type: array
              items:
                type: string
    ProjectMetadataPerson:
      type: object
      description: Person information extracted from import folder metadata, with
        optional EcoPart user match.
      properties:
        name:
          type: string
          description: Full name of the person.
          example: "Jane DOE"
        email:
          type: string
          description: Email address of the person.
          example: "jane.doe@example.com"
        ecopart_user_id:
          type: integer
          nullable: true
          description: The EcoPart user ID if a matching account was found by email, null
            otherwise.
          example: 42
    ProjectMetadata:
      type: object
      description: |
        Project metadata extracted from an import folder. Used to pre-fill the project creation form.
        Sources: `config/cruise_info.txt` (INI key=value) and the meta header (semicolon-delimited CSV):
        `meta/<instrument>_header_<rest of the folder name>.txt` only.
      properties:
        project_acronym:
          type: string
          nullable: true
          description: "Source: `config/cruise_info.txt` → key `acron`."
          example: "MPS2024"
        project_description:
          type: string
          nullable: true
          description: "Source: `config/cruise_info.txt` → key `description`."
          example: "Particle survey in the Mediterranean Sea"
        cruise:
          type: string
          nullable: true
          description: "Source: meta header → column 1 (cruise) of the first data
            row. Fallback: `config/cruise_info.txt` → key `acron`."
          example: "MPS2024"
        ship:
          type: string
          nullable: true
          description: "Source: meta header → column 2 (ship) of the first data
            row."
          example: "R/V Thalassa"
        serial_number:
          type: string
          nullable: true
          description: "Source: `config/cruise_info.txt` → key `sn`. Fallback: extracted
            from the header filename pattern `sn<serial_number>_` (e.g.
            `uvp6_header_sn000241lp_...txt`)."
          example: "002LP"
        instrument_model:
          type: string
          nullable: true
          description: |
            Deduced automatically from two sources:
            1. Folder structure: presence of `ecodata/` → UVP6, presence of `work/` → UVP5.
            2. Serial number suffix: LP → UVP6LP, HF → UVP6HF, MHP → UVP6MHP, MHF → UVP6MHF, HD → UVP5HD, SD → UVP5SD, ZD → UVP5Z.
            Returns null if instrument type cannot be determined.
          example: "UVP6LP"
          enum: [ UVP5HD, UVP5SD, UVP5Z, UVP6LP, UVP6HF, UVP6MHP, UVP6MHF ]
        data_owner:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ProjectMetadataPerson"
          description: "Source: `config/cruise_info.txt` → keys `do_name` (name) and
            `do_email` (email). `ecopart_user_id` is resolved by looking up the
            email in the EcoPart user database."
        operator:
          nullable: true
          allOf:
