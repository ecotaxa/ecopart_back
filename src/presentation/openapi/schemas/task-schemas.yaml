components:
  schemas:
    TaskResponse:
      type: object
      description: Task information returned by API endpoints.
      properties:
        task_id:
          type: integer
          description: Unique task identifier.
          example: 1
        task_type_id:
          type: integer
          description: Task type ID.
        task_type:
          type: string
          description: Task type label.
          enum:
            - EXPORT
            - IMPORT
            - IMPORT_BACKUP
            - EXPORT_BACKUP
            - IMPORT_CTD
            - IMPORT_ECO_TAXA
            - EXPORT_RAW
            - REGENERATE_PIVOT
            - COMPUTE_PARTICLE_STATS
          example: "IMPORT"
        task_status_id:
          type: integer
          description: Task status ID.
        task_status:
          type: string
          description: Task status label. CANCELLING means a cancellation was requested on a running task, which stops at its next checkpoint.
          enum:
            - PENDING
            - RUNNING
            - CANCELLING
            - DONE
            - ERROR
            - CANCELLED
          example: "DONE"
        task_owner_id:
          type: integer
          description: User ID of the task owner.
        task_owner:
          type: string
          description: Display name of the task owner.
        task_project_id:
          type: integer
          description: Associated project ID.
        task_params:
          type: object
          description: Task-specific parameters.
        task_creation_utc_date_time:
          type: string
          description: Task creation date (ISO 8601 UTC).
          example: "2024-01-15T10:30:00.000Z"
        task_start_utc_date_time:
          type: string
          description: Date the task started running (ISO 8601 UTC).
        task_end_utc_date_time:
          type: string
          description: Date the task reached DONE, ERROR or CANCELLED (ISO 8601 UTC).
        task_progress_pct:
          type: number
          description: Task progress percentage (0-100).
          minimum: 0
          maximum: 100
          example: 100
        task_progress_msg:
          type: string
          description: Current progress message.
        task_result:
          type: string
          description: Task result summary.
        task_error:
          type: string
          description: Task error message if failed.

    TaskSearchResponse:
      type: object
      description: Paginated task search results.
      properties:
        search_info:
          $ref: "#/components/schemas/SearchInfo"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskResponse"
