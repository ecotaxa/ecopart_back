name: Deploy to preprod server

# Manual promotion: pick a version that has already been built, published and validated on the
# test server, and roll it out to preprod. Nothing here is triggered by a tag push on purpose —
# preprod must only ever receive a version someone has decided to promote.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to promote, e.g. v0.0.67 (must already be on Docker Hub)'
        required: true
        type: string

# Never let two promotions race: the second waits for the first to finish.
concurrency:
  group: deploy-preprod
  cancel-in-progress: false

jobs:
  promote:
    name: Point the :preprod image at the requested version
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ecopart_back
      VERSION: ${{ inputs.version }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check the requested version exists on Docker Hub
        run: |
          if ! docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION was not found on Docker Hub. Only tags built after"
            echo "::error::versioned image tags were introduced are promotable; check the tag name."
            exit 1
          fi

      - name: Move the :preprod tag to the requested version
        # imagetools re-points the tag at the existing multi-arch manifest server-side:
        # no rebuild, no pull, both amd64 and arm64 are preserved.
        run: |
          docker buildx imagetools create -t "$IMAGE:preprod" "$IMAGE:$VERSION"
          echo "\`$IMAGE:preprod\` now points at **$VERSION**" >> "$GITHUB_STEP_SUMMARY"

  deploy-preprod:
    name: Restart the backend on the preprod server
    needs: promote
    # TODO: this job stays queued until a self-hosted runner carrying the `ecopart-preprod`
    # label is registered on the preprod server (see README, "Deployment to the preprod server").
    runs-on: [self-hosted, ecopart-preprod]

    steps:
      - name: Deploy the promoted backend image
        env:
          # TODO: confirm this path once the preprod server is set up. Directory on the server
          # holding the front+back docker-compose.yml + .env. That compose file is maintained by
          # hand on the server and is NOT touched by CI; its `api` service must use the image
          # `ecotaxa/ecopart_back:preprod`.
          DEPLOY_DIR: /ecotaxadev2/ecopart/preprod
          SERVICE: api # backend service name in that compose (the frontend service `web` is left alone)
          VERSION: ${{ inputs.version }}
        run: |
          if [ ! -f "$DEPLOY_DIR/docker-compose.yml" ]; then
            echo "::error::No docker-compose.yml in $DEPLOY_DIR. Fix DEPLOY_DIR in .github/workflows/preprod.yml."
            exit 1
          fi
          cd "$DEPLOY_DIR"
          # Capture the running backend image so we can remove only ours afterwards.
          OLD_IMAGE=$(docker compose images -q "$SERVICE")
          # Pull + recreate ONLY the backend service; the frontend (web) stays untouched.
          # The compose file pins `:preprod`, which the promote job just moved to $VERSION.
          docker compose pull "$SERVICE"
          docker compose up -d "$SERVICE"
          # Remove the previous backend image only (if it changed and is now unused).
          NEW_IMAGE=$(docker compose images -q "$SERVICE")
          if [ -n "$OLD_IMAGE" ] && [ "$OLD_IMAGE" != "$NEW_IMAGE" ]; then
            docker image rm "$OLD_IMAGE" 2>/dev/null || true
          fi
          echo "Preprod backend now running **$VERSION** (image \`$NEW_IMAGE\`)" >> "$GITHUB_STEP_SUMMARY"
